syntax = "proto3";
package side.dlc;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sideprotocol/side/x/dlc/types";

enum DLCOracleStatus {
    Oracle_Status_Pending = 0;
    Oracle_Status_Failed = 1;
    Oracle_Status_Timedout = 2;
    Oracle_status_Enable = 3;
    Oracle_status_Disable = 4;
}

message DLCOracle {
    uint64 id = 1;
    string desc = 2;
    repeated string participants = 3;
    uint32 threshold = 4;
    string pubkey = 5;
    uint64 nonce_index = 6;
    google.protobuf.Timestamp time = 7 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    DLCOracleStatus status = 8;
}

enum DCMStatus {
    DCM_Status_Pending = 0;
    DCM_Status_Failed = 1;
    DCM_Status_Timedout = 2;
    DCM_status_Enable = 3;
    DCM_status_Disable = 4;
}

message DCM {
    uint64 id = 1;
    string desc = 2;
    repeated string participants = 3;
    uint32 threshold = 4;
    string pubkey = 5;
    google.protobuf.Timestamp time = 6 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    DCMStatus status = 7;
}

message DLCNonce {
    uint64 index = 1;
    string nonce = 2;
    string oracle_pubkey = 3;
    google.protobuf.Timestamp time = 4 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

enum DlcEventType {
    UNSPECIFIED = 0;
    PRICE = 1;
    DATE = 2;
    LENDING = 3;
}

message DLCEvent {
    uint64 id = 1;
    DlcEventType type = 2;
    string nonce = 3;
    string pubkey = 4;
    string description = 5;
    repeated string outcomes = 6;
    bool has_triggered = 7;
    int32 outcome_index = 8;
    google.protobuf.Timestamp publish_at = 9 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    google.protobuf.Timestamp trigger_at = 10 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

message DLCAttestation {
    uint64 id = 1;
    uint64 event_id = 2;
    string outcome = 3;
    string pubkey = 4;
    string signature = 5;
    google.protobuf.Timestamp time = 6 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}
