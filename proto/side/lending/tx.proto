syntax = "proto3";
package side.lending;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos/base/v1beta1/coin.proto";
import "side/lending/lending.proto";
import "side/lending/params.proto";

option go_package = "github.com/sideprotocol/side/x/lending/types";

// Msg defines the Msg service.
service Msg {
    option (cosmos.msg.v1.service) = true;

    rpc CreatePool(MsgCreatePool) returns (MsgCreatePoolResponse);
    rpc AddLiquidity(MsgAddLiquidity) returns (MsgAddLiquidityResponse);
    rpc RemoveLiquidity(MsgRemoveLiquidity) returns (MsgRemoveLiquidityResponse);
    rpc UpdatePoolConfig(MsgUpdatePoolConfig) returns (MsgUpdatePoolConfigResponse);
    rpc Apply(MsgApply) returns (MsgApplyResponse);
    rpc SubmitCets(MsgSubmitCets) returns (MsgSubmitCetsResponse);
    rpc Approve(MsgApprove) returns (MsgApproveResponse);
    rpc SubmitRepaymentAdaptorSignatures(MsgSubmitRepaymentAdaptorSignatures) returns (MsgSubmitRepaymentAdaptorSignaturesResponse);
    rpc Cancel(MsgCancel) returns (MsgCancelResponse);
    rpc SubmitCancellationSignatures(MsgSubmitCancellationSignatures) returns (MsgSubmitCancellationSignaturesResponse);
    rpc Repay(MsgRepay) returns (MsgRepayResponse);
    rpc SubmitLiquidationSignatures(MsgSubmitLiquidationSignatures) returns (MsgSubmitLiquidationSignaturesResponse);

    // SubmitPrice submits the price for testing 
    rpc SubmitPrice(MsgSubmitPrice) returns (MsgSubmitPriceResponse);

    // UpdateParams defines a governance operation for updating the x/lending module
    // parameters. The authority defaults to the x/gov module account.
    //
    // Since: cosmos-sdk 0.47
    rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgCreatePool {
    option (cosmos.msg.v1.signer) = "authority";

    // authority is the address that controls the module (defaults to x/gov unless overwritten).
    string authority = 1;
    // pool id
    string id = 2;
    // lending asset
    string lending_asset = 3;
    // pool config
    PoolConfig config = 4 [(gogoproto.nullable) = false];
}

message MsgCreatePoolResponse{}

message MsgUpdatePoolConfig {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1;
  // pool id
  string pool_id = 2;
  // pool config
  PoolConfig config = 3 [(gogoproto.nullable) = false];
}

message MsgUpdatePoolConfigResponse {}

message MsgRepay{
    option (cosmos.msg.v1.signer) = "borrower";

    string borrower = 1;
    string loan_id = 2;
}

message MsgRepayResponse{}

message MsgAddLiquidity {
    option (cosmos.msg.v1.signer) = "lender";

    string lender = 1;
    string pool_id = 2;
    cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}

message MsgAddLiquidityResponse {}

message MsgRemoveLiquidity {
    option (cosmos.msg.v1.signer) = "lender";

    string lender = 1;
    cosmos.base.v1beta1.Coin stokens = 2 [(gogoproto.nullable) = false, (gogoproto.customname) = "STokens"];
}

message MsgRemoveLiquidityResponse {}

message MsgApply {
    option (cosmos.msg.v1.signer) = "borrower";

    string borrower = 1;
    string borrower_pubkey = 2;
    int64 maturity = 3;
    string pool_id = 4;
    cosmos.base.v1beta1.Coin borrow_amount = 5 [(gogoproto.nullable) = false];
    uint64 dcm_id = 6 [(gogoproto.customname) = "DCMId"];
    string referrer = 7;
}

message MsgApplyResponse {}

message MsgSubmitCets {
    option (cosmos.msg.v1.signer) = "borrower";

    string borrower = 1;
    string loan_id = 2;
    string deposit_tx = 3;
    string liquidation_cet = 4;
    repeated string liquidation_adaptor_signatures = 5;
    repeated string default_liquidation_adaptor_signatures = 6;
    string repayment_cet = 7;
    repeated string repayment_signatures = 8;
}

message MsgSubmitCetsResponse {

}

message MsgApprove {
    option (cosmos.msg.v1.signer) = "relayer";
    
    string relayer = 1;
    string vault = 2;
    string deposit_tx = 3;
    string block_hash = 4;
    repeated string proof = 5;
}

message MsgApproveResponse {

}

message MsgCancel {
    option (cosmos.msg.v1.signer) = "borrower";
    
    string borrower = 1;
    string loan_id = 2;
    string tx = 3;
    repeated string signatures = 4;
}

message MsgCancelResponse {

}

message MsgSubmitCancellationSignatures {
    option (cosmos.msg.v1.signer) = "sender";
    
    string sender = 1;
    string loan_id = 2;
    repeated string signatures = 3;
}

message MsgSubmitCancellationSignaturesResponse {

}

message MsgSubmitRepaymentAdaptorSignatures {
    option (cosmos.msg.v1.signer) = "sender";
    
    string sender = 1;
    string loan_id = 2;
    repeated string adaptor_signatures = 3;
}

message MsgSubmitRepaymentAdaptorSignaturesResponse {

}

message MsgSubmitLiquidationSignatures {
    option (cosmos.msg.v1.signer) = "sender";
    
    string sender = 1;
    string loan_id = 2;
    repeated string signatures = 3;
}

message MsgSubmitLiquidationSignaturesResponse {

}

message MsgSubmitPrice {
    option (cosmos.msg.v1.signer) = "sender";

    string sender = 1;
    string price = 2;
}

message MsgSubmitPriceResponse{}

// MsgUpdateParams is the Msg/UpdateParams request type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1;

  // params defines the x/dlc parameters to be updated.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse defines the Msg/UpdateParams response type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParamsResponse {}