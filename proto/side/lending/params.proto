syntax = "proto3";
package side.lending;

import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/sideprotocol/side/x/lending/types";

// Params defines the parameters for the module.
message Params {
    // minimum loan duration
    google.protobuf.Duration min_loan_duration = 1 [(gogoproto.nullable) = false, (gogoproto.stdduration) = true];
    // maximum loan duration
    google.protobuf.Duration max_loan_duration = 2 [(gogoproto.nullable) = false, (gogoproto.stdduration) = true];
    // final timeout duration for loan
    google.protobuf.Duration final_timeout_duration = 3 [(gogoproto.nullable) = false, (gogoproto.stdduration) = true];
    // origination fee collector address
    string origination_fee_collector = 4;
    // protocol fee collector address
    string protocol_fee_collector = 5;
}
