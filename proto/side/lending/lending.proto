syntax = "proto3";
package side.lending;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "side/btcbridge/btcbridge.proto";

option go_package = "github.com/sideprotocol/side/x/lending/types";

// Status options for a lending pool
enum PoolStatus {
    INACTIVE = 0;
    ACTIVE = 1;
    PAUSED = 2;
}

// Pool tranche config
message PoolTrancheConfig {
  // maturity duration in seconds
  int64 maturity = 1;
  // borrow apr permille
  uint32 borrow_apr = 2 [(gogoproto.customname) = "BorrowAPR"];
  // minimum maturity factor permille
  uint32 min_maturity_factor = 3;
}

// Pool config
message PoolConfig {
    // supply cap
    string supply_cap = 1 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // borrow cap
    string borrow_cap = 2 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // minimum amount to be borrowed
    string min_borrow_amount = 3 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // maximum amount to be borrowed
    string max_borrow_amount = 4 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // tranches
    repeated PoolTrancheConfig tranches = 5 [(gogoproto.nullable) = false];
    // request fee
    cosmos.base.v1beta1.Coin request_fee = 6 [
      (gogoproto.nullable) = false
    ];
    // origination fee
    string origination_fee = 7 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // reserve factor permille
    uint32 reserve_factor = 8;
    // referral fee factor permille
    uint32 referral_fee_factor = 9;
    // maximum ltv percent
    uint32 max_ltv = 10;
    // liquidation ltv percent
    uint32 liquidation_threshold = 11;
    // indicates if the pool is paused
    bool paused = 12;
}

// Pool tranche
message PoolTranche {
    // maturity duration
    int64 maturity = 1;
    // borrow index
    string borrow_index = 2 [
      (cosmos_proto.scalar)  = "cosmos.Dec",
      (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
      (gogoproto.nullable)   = false
    ];
    // total borrowed
    string total_borrowed = 3 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
     // total reserve
    string total_reserve = 4 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
}

message LendingPool {
    string id = 1;
    cosmos.base.v1beta1.Coin supply = 2 [
      (gogoproto.nullable) = false
    ];
    string available_amount = 3 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string borrowed_amount = 4 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string total_borrowed = 5 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string reserve_amount = 6 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string total_reserve = 7 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    cosmos.base.v1beta1.Coin total_stokens = 8 [
      (gogoproto.nullable) = false,
      (gogoproto.customname) = "TotalSTokens"
    ];
    repeated PoolTranche tranches = 9 [(gogoproto.nullable) = false];
    PoolConfig config = 10 [(gogoproto.nullable) = false];
    PoolStatus status = 11;
}

// Loan Status
enum LoanStatus {
    // Unspecified
    Unspecified = 0;
    // Loan Requested
    Requested = 1;
    // Loan Open
    Open = 2;
    // Loan Rejected
    Rejected = 3;
    // Loan Cancelled
    Cancelled = 4;
    // Loan Repaid
    Repaid = 5;
    // Loan Defaulted
    Defaulted = 6;
    // Loan Liquidated
    Liquidated = 7;
    // Loan Closed
    Closed = 8;
}

// Deposits used for CET authorization
message AuthorizationDeposits {
  repeated string deposit_txs = 1;
}

message Loan {
    string vault_address = 1; // id
    string borrower = 2;
    string borrowerPubKey = 3;
    string dcm = 4 [(gogoproto.customname) = "DCM"];
    int64 maturity_time = 5;
    int64 final_timeout = 6;
    string pool_id = 7;
    cosmos.base.v1beta1.Coin borrow_amount = 8 [(gogoproto.nullable) = false];
    cosmos.base.v1beta1.Coin request_fee = 9 [(gogoproto.nullable) = false];
    string origination_fee = 10 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string interest = 11 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string protocol_fee = 12 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    int64 maturity = 13;
    uint32 borrow_apr = 14 [(gogoproto.customname) = "BorrowAPR"];
    int64 min_maturity = 15;
    string start_borrow_index = 16 [
      (cosmos_proto.scalar)  = "cosmos.Dec",
      (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
      (gogoproto.nullable)   = false
    ];
    string liquidation_price = 17 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    uint64 liquidation_event_id = 18;
    uint64 default_liquidation_event_id = 19;
    uint64 repayment_event_id = 20;
    repeated AuthorizationDeposits authorization_deposits = 21 [(gogoproto.nullable) = false];
    string collateral_amount = 22 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    uint64 liquidation_id = 23;
    string referrer = 24;
    google.protobuf.Timestamp create_at = 25 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    google.protobuf.Timestamp disburse_at = 26 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    LoanStatus status = 27;
}

enum CetType {
  LIQUIDATION = 0;
  DEFAULT_LIQUIDATION = 1;
  REPAYMENT = 2;
}

message CetInfo {
  uint64 event_id = 1;
  uint32 outcome_index = 2;
  string signature_point = 3;
  string script = 4;
}

message LiquidationCet {
  string tx = 1;
  repeated string borrower_adaptor_signatures = 2;
  repeated string borrower_adapted_signatures = 3;
  repeated string dcm_signatures = 4 [(gogoproto.customname) = "DCMSignatures"];
  string signed_tx_hex = 5;
}

message RepaymentCet {
  string tx = 1;
  repeated string dcm_adaptor_signatures = 2 [(gogoproto.customname) = "DCMAdaptorSignatures"];
  repeated string dcm_adapted_signatures = 3 [(gogoproto.customname) = "DCMAdaptedSignatures"];
  repeated string borrower_signatures = 4;
  string signed_tx_hex = 5;
}

message DLCMeta {
    LiquidationCet liquidation_cet = 1 [(gogoproto.nullable) = false]; 
    LiquidationCet default_liquidation_cet = 2 [(gogoproto.nullable) = false];
    RepaymentCet repayment_cet = 3 [(gogoproto.nullable) = false];
    string timeout_refund_tx = 4;
    repeated side.btcbridge.UTXO vault_utxos = 5;
    string internal_key = 6;
    string multisig_script = 7;
    string timeout_refund_script = 8;
}

message DepositLog {
    string txid = 1;
    string vault_address = 2;
    string deposit_tx = 3;
    bool verified = 4;
}

message Repayment {
    string loan_id = 1;
    cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
    google.protobuf.Timestamp create_at = 3 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

message Cancellation {
    string loan_id = 1;
    string txid = 2;
    string tx = 3;
    repeated string signatures = 4;
    repeated string dcm_signatures = 5 [(gogoproto.customname) = "DCMSignatures"];
    google.protobuf.Timestamp create_at = 6 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

// Signing intent
enum SigningIntent {
  SIGNING_INTENT_REPAYMENT = 0;
  SIGNING_INTENT_LIQUIDATION = 1;
  SIGNING_INTENT_DEFAULT_LIQUIDATION = 2;
  SIGNING_INTENT_CANCELLATION = 3;
}