syntax = "proto3";
package side.lending;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";
import "side/btcbridge/btcbridge.proto";

option go_package = "github.com/sideprotocol/side/x/lending/types";

// Status options for a lending pool
enum PoolStatus {
    INACTIVE = 0;
    ACTIVE = 1;
}

// Lending pool config
message PoolConfig {
    // supply rate permille
    uint32 supply_rate = 1;
    // borrow rate permille
    uint32 borrow_rate = 2;
    // reserve factor permille
    uint32 reserve_factor = 3;
    // supply cap
    string supply_cap = 4 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // borrow cap
    string borrow_cap = 5 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // debt ceiling
    string debt_ceiling = 6 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // origination fee
    string origination_fee = 7 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    // maximum loan to value permille
    uint32 ltv = 8;
    // liquidation ltv permille
    uint32 liquidation_threshold = 9;
    // liquidation penalty permille
    uint32 liquidation_penalty = 10;
}

message LendingPool {
    string id = 1;
    cosmos.base.v1beta1.Coin supply = 2 [
      (gogoproto.nullable)     = false,
      (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coin"
    ];
    string available_amount = 3 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string borrowed_amount = 4 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    string total_shares = 5 [
      (gogoproto.customtype) = "cosmossdk.io/math.Int",
      (gogoproto.nullable) = false
    ];
    PoolConfig config = 6 [(gogoproto.nullable) = false];
    PoolStatus status = 7;
}

// Loan Status
enum LoanStatus {
    // Unspecified
    Unspecified = 0;
    // Loan Requested
    Requested = 1;
    // Loan Open
    Open = 2;
    // Loan Rejected
    Rejected = 3;
    // Loan Cancelled
    Cancelled = 4;
    // Loan Repaid
    Repaid = 5;
    // Loan Defaulted
    Defaulted = 6;
    // Loan Liquidated
    Liquidated = 7;
    // Loan Closed
    Closed = 8;
}

message Loan {
    string vault_address = 1; // id
    string borrower = 2;
    string borrowerPubKey = 3;
    string agency = 4;
    int64 maturity_time = 5;
    int64 final_timeout = 6;
    
    cosmos.base.v1beta1.Coin borrow_amount = 7;
    string fees = 8 [
        (gogoproto.customtype) = "cosmossdk.io/math.Int",
        (gogoproto.nullable) = false
      ];
    string interests = 9 [
        (gogoproto.customtype) = "cosmossdk.io/math.Int",
        (gogoproto.nullable) = false
      ];

    string term = 10 [
        (gogoproto.customtype) = "cosmossdk.io/math.Int",
        (gogoproto.nullable) = false
      ];
    uint64 event_id = 11;
    uint64 attestation_id = 12;
    repeated string deposit_txs = 13;
    string collateral_amount = 14 [
        (gogoproto.customtype) = "cosmossdk.io/math.Int",
        (gogoproto.nullable) = false
      ];
    string pool_id = 15;
    uint64 auction_id = 16;
    google.protobuf.Timestamp create_at = 17 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
    LoanStatus status = 18;
}

message DLCMeta {
    string liquidation_cet = 1;
    string signed_liquidation_cet_hex = 2;
    string liquidation_adaptor_signature = 3;
    string liquidation_adapted_signature = 4;
    repeated string liquidation_agency_signatures = 5;
    side.btcbridge.UTXO vault_utxo = 6;
    string internal_key = 7;
    string liquidation_cet_script = 8;
    string repayment_script = 9;
    string forced_repayment_script = 10;
    string timeout_refund_script = 11;
}

message DepositLog {
    string txid = 2;
    string vault_address = 1;
    string deposit_tx = 3;
} 

message Repayment {
    string loan_id = 1;
    string txid = 2;
    string tx = 3;
    string repay_adaptor_point = 4;
    repeated string dca_adaptor_signatures = 5;
    string borrower_signature = 6;
    google.protobuf.Timestamp create_at = 7 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

message Cancellation {
    string loan_id = 1;
    string txid = 2;
    string tx = 3;
    repeated string signatures = 4; 
    repeated string dca_signatures = 5;
    google.protobuf.Timestamp create_at = 6 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}