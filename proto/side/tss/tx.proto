syntax = "proto3";
package side.tss;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "side/tss/params.proto";

option go_package = "github.com/sideprotocol/side/x/tss/types";

// Msg defines the Msg service.
service Msg {
    option (cosmos.msg.v1.service) = true;

    // CompleteDKG completes the given DKG request by the participant.
    rpc CompleteDKG (MsgCompleteDKG) returns (MsgCompleteDKGResponse);

    // SubmitSignatures submits signatures.
    rpc SubmitSignatures(MsgSubmitSignatures) returns (MsgSubmitSignaturesResponse);

    // RefreshShares refreshes key shares (a.k.a. reshare).
    rpc RefreshShares(MsgRefreshShares) returns (MsgRefreshSharesResponse);

    // CompleteResharing completes the given resharing request by the participant.
    rpc CompleteResharing(MsgCompleteResharing) returns (MsgCompleteResharingResponse);

    // UpdateParams defines a governance operation for updating the x/tss module
    // parameters. The authority defaults to the x/gov module account.
    //
    // Since: cosmos-sdk 0.47
    rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgCompleteDKG is the Msg/CompleteDKG request type.
message MsgCompleteDKG {
  option (cosmos.msg.v1.signer) = "sender";

  // sender
  string sender = 1;
  // DKG request id
  uint64 id = 2;
  // public keys generated by DKG
  repeated string pub_keys = 3;
  // participant consensus pub key
  string consensus_pubkey = 4;
  // hex encoded participant signature
  string signature = 5;
}

// MsgCompleteDKGResponse defines the Msg/CompleteDKG response type.
message MsgCompleteDKGResponse {}

// MsgSubmitSignatures defines the Msg/SubmitSignatures request type.
message MsgSubmitSignatures {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1;
  uint64 id = 2;
  repeated string signatures = 3;
}

// MsgSubmitSignaturesResponse defines the Msg/SubmitSignatures response type.
message MsgSubmitSignaturesResponse {}

// MsgRefreshShares defines the Msg/RefreshShares request type.
message MsgRefreshShares {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1;
  // dkg request id
  uint64 dkg_id = 2;
  // public key corresponding to shares to be refreshed
  string pub_key = 3;
  // participant set
  repeated string participants = 4;
}

// MsgRefreshSharesResponse defines the Msg/RefreshShares response type.
message MsgRefreshSharesResponse {}

// MsgCompleteResharing defines the Msg/CompleteResharing request type.
message MsgCompleteResharing {
  option (cosmos.msg.v1.signer) = "sender";

  // sender
  string sender = 1;
  // request id
  uint64 id = 2;
  // participant consensus pub key
  string consensus_pubkey = 3;
  // hex encoded participant signature
  string signature = 4;
}

// MsgCompleteResharingResponse defines the Msg/CompleteResharing response type.
message MsgCompleteResharingResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1;

  // params defines the x/tss parameters to be updated.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse defines the Msg/UpdateParams response type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParamsResponse {}
